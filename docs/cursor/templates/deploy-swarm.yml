# Template .github/workflows/deploy-swarm.yml — adaptar STACK_NAME, ENV_FILE e ASGI_MODULE.
# Pipeline separado de ci.yml (rule 075), porém ENCADEADO: só roda após o CI passar na main.
# Gatilho workflow_run: 1 push na main = 1 run de CI + 0 ou 1 run de Deploy (após CI verde).
# NÃO usar "on: push" aqui quando o projeto já tem ci.yml na main (deploy paralelo ao CI é proibido).
# Não incluir migrate Django; Alembic é opcional.
name: Build and Deploy to Docker Swarm

on:
  workflow_run:
    workflows: ["CI"]   # nome EXATO do workflow em ci.yml (name: CI)
    types:
      - completed
    branches:
      - main

env:
  STACK_NAME: {STACK_NAME}
  STACK_FILE: deploy/stack.yml
  ENV_FILE: /opt/envs/{env-file-name}.env
  SERVICE_NAME: {STACK_NAME}_web
  # SHA do commit testado pelo CI. Em workflow_run, github.sha aponta para o HEAD do
  # branch padrão no momento do evento, NÃO para o commit testado — usar head_sha.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
  # Descomente se o projeto usar Alembic:
  # RUN_ALEMBIC: "true"

jobs:
  deploy:
    runs-on: [self-hosted, linux, swarm]

    # Gate: só faz deploy se o CI concluiu com sucesso. Se o CI falhar, o deploy NÃO roda.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout do commit EXATO testado pelo CI (não do HEAD atual da main).
          ref: ${{ env.COMMIT_SHA }}

      - name: Define image name
        run: |
          IMAGE_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${IMAGE_NAME}:${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=ghcr.io/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CACHE_BUST=${{ env.COMMIT_SHA }}
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_LATEST }}

      - name: Pull image on runner
        run: |
          docker pull "${IMAGE}"
          docker pull "${IMAGE_LATEST}"

      - name: Validate Swarm cluster and network
        run: |
          set -euo pipefail

          echo "Validando managers do Docker Swarm..."
          docker node ls

          if ! docker info --format '{{.Swarm.LocalNodeState}}' | grep -qx active; then
            echo "ERRO: Docker Swarm não está ativo."
            exit 1
          fi

          if ! docker info --format '{{.Swarm.ControlAvailable}}' | grep -qx true; then
            echo "ERRO: O runner não está executando em um manager."
            exit 1
          fi

          if ! docker network inspect app_network >/dev/null 2>&1; then
            echo "Rede app_network não encontrada. Criando rede overlay..."
            docker network create \
              --driver overlay \
              --attachable \
              app_network
          fi

          docker network inspect app_network \
            --format 'Rede={{.Name}} Driver={{.Driver}} Scope={{.Scope}} Attachable={{.Attachable}}'

      - name: Validate environment file
        run: |
          test -f "${ENV_FILE}" || { echo "Arquivo ${ENV_FILE} não encontrado no runner."; exit 1; }
          grep -q '^APP_PORT=' "${ENV_FILE}" || { echo "APP_PORT ausente em ${ENV_FILE}"; exit 1; }

      - name: Run Alembic migrations (optional)
        if: env.RUN_ALEMBIC == 'true'
        run: |
          docker run --rm \
            --env-file "${ENV_FILE}" \
            "${IMAGE}" \
            alembic upgrade head

      - name: Deploy stack
        run: |
          set -a
          # shellcheck disable=SC1090
          source "${ENV_FILE}"
          set +a
          export IMAGE="${IMAGE}"

          docker pull "${IMAGE}"

          docker stack deploy \
            --with-registry-auth \
            -c "${STACK_FILE}" \
            "${STACK_NAME}"

          docker service inspect "${SERVICE_NAME}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'

      - name: Wait for replicas
        run: |
          TIMEOUT=600
          INTERVAL=15
          STABLE_REQUIRED=2
          SERVICE="${SERVICE_NAME}"
          EXPECTED_IMAGE="${IMAGE}"
          stable_count=0
          elapsed=0

          echo "Aguardando 3/3 réplicas estáveis com imagem ${EXPECTED_IMAGE}..."

          while [ "${elapsed}" -lt "${TIMEOUT}" ]; do
            replicas_line=$(docker service ls --format '{{.Name}} {{.Replicas}}' | awk -v svc="${SERVICE}" '$1 == svc { print $2; exit }')
            if [ -z "${replicas_line}" ]; then
              echo "Serviço ${SERVICE} ainda não listado..."
              sleep "${INTERVAL}"
              elapsed=$((elapsed + INTERVAL))
              continue
            fi

            running=$(docker service ps "${SERVICE}" \
              --filter "desired-state=running" \
              --format '{{.CurrentState}}' | grep -c 'Running' || true)

            image_count=$(docker service ps "${SERVICE}" \
              --filter "desired-state=running" \
              --format '{{.Image}}' | grep -c "${COMMIT_SHA}" || true)

            echo "Réplicas: ${replicas_line} | Running: ${running} | Mesma tag SHA: ${image_count}/${running}"

            if [ "${replicas_line}" = "3/3" ] && [ "${running}" -eq 3 ] && [ "${image_count}" -eq 3 ]; then
              stable_count=$((stable_count + 1))
              if [ "${stable_count}" -ge "${STABLE_REQUIRED}" ]; then
                echo "Deploy estável: 3/3 na tag ${COMMIT_SHA}."
                exit 0
              fi
            else
              stable_count=0
            fi

            sleep "${INTERVAL}"
            elapsed=$((elapsed + INTERVAL))
          done

          echo "Timeout após ${TIMEOUT}s. Verifique no manager:"
          echo "  docker service ls | grep ${STACK_NAME}"
          echo "  docker service ps ${SERVICE} --filter desired-state=running --format '{{.Node}} {{.Image}}'"
          exit 1
